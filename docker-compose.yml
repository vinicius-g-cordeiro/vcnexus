services:
  db:
    container_name: db
    image: postgres:18
    restart: unless-stopped
    ports:
      - 5434:5432 # expose a different port to be able to connect in DBeaver
    expose:
      - 5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-user.sh:/docker-entrypoint-initdb.d/01-init-user.sh:ro
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_password
      POSTGRES_USER: app_root
      POSTGRES_DB: app_db
      PGDATA: /var/lib/postgresql/data/pgdata
      APP_DB_USER: ${DB_USERNAME-app_user}
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    secrets:
      - db_root_password
      - db_password
      - db_app_password
      - db_username
    networks:
      - app_network

  pgdog:
    container_name: pgdog
    build:
      context: .
      dockerfile: infrastructure/pgdog/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USERNAME=${DB_USERNAME-app_user}
      - PGDOG_DATABASE_NAME=${PGDOG_DATABASE_NAME-primary_database}
      - PGSQL_DATABASE_NAME=${PGSQL_DATABASE_NAME-app_db}
    secrets:
      - db_username
      - db_app_password
      - pgdog_admin_password
    volumes:
      - ./infrastructure/pgdog/pgdog.toml.tpl:/etc/pgdog/pgdog.toml.tpl:ro
      - ./infrastructure/pgdog/users.toml.tpl:/etc/pgdog/users.toml.tpl:ro
      - ./infrastructure/pgdog/entrypoint.sh:/entrypoint.sh
    ports:
      - "6432:6432"
    networks:
      - app_network

  php:
    container_name: php
    env_file:
      - infrastructure/php/.env
    build:
      context: .
      dockerfile: infrastructure/php/Dockerfile
      args:
        BACKEND_DIR: ./backend
        PHP_VERSION: ${PHP_VERSION-8.4}
        ENV_FILE: ./infrastructure/php/.env
    environment:
      - DB_HOST=${PGDOG_HOST-pgdog}
      - DB_PORT=${PGDOG_PORT-6432}
      - DB_PASSWORD=/run/secrets/db_app_password
      - DB_USERNAME=${DB_USERNAME-app_user}
      - REDIS_PASSWORD=/run/secrets/redis_password
      - JWT_SECRET=/run/secrets/jwt_secret
      - SMTP_USERNAME=/run/secrets/smtp_user
      - SMTP_PASSWORD=/run/secrets/smtp_password
      - ADMIN_PASSWORD=/run/secrets/admin_password
      - APP_KEY=/run/secrets/app_key
      - INSTALL_XDEBUG=${INSTALL_XDEBUG-true}
      - XDEBUG_MODE=${XDEBUG_MODE-debug,develop}
      - XDEBUG_CONFIG=client_host=${XDEBUG_CLIENT_HOST-host.docker.internal} client_port=${XDEBUG_CLIENT_PORT-9003}
      - PHP_IDE_CONFIG=serverName=${XDEBUG_SERVER_NAME-app}
    working_dir: /var/www
    depends_on:
      pgdog:
        condition: service_started
      redis:
        condition: service_healthy
      cache:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:38.0.101.76
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '1.0'
          memory: 1024M
    volumes:
      - ./backend:/var/www
      - ./infrastructure/php/.env:/var/www/.env
      - ./infrastructure/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      - ./infrastructure/php/php.ini:/usr/local/etc/php/conf.d/php-custom.ini
    secrets:
      - db_username
      - db_password
      - jwt_secret
      - redis_password
      - smtp_password
      - smtp_user
      - admin_password
      - db_app_password
      - pgdog_admin_password
    networks:
      - app_network


  redis:
    container_name: redis
    image: redis:alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PORT=${REDIS_PORT-6379}
    command:
      - sh
      - -c
      - 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT-6379}:${REDIS_PORT-6379}"
    networks:
      - app_network
    
  cache: 
    container_name: cache
    image: memcached:alpine
    restart: unless-stopped
    ports:
      - "${CACHE_PORT-11211}:${CACHE_PORT-11211}"
    healthcheck:
      test: [ 'CMD', 'memcached', '-h', 'localhost' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  websocket:
    container_name: websocket
    ports:
      - "${WS_PORT-8080}:${WS_PORT-8080}"
    build:
      context: .
      dockerfile: infrastructure/php-ws/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION-8.4}
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      redis:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      - REDIS_PASSWORD=/run/secrets/redis_password
      - APP_KEY=/run/secrets/app_key
    volumes:
      - ./backend:/var/www
    secrets:
      - redis_password
      - app_key
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - app_network

  queue-worker:
    container_name: queue_worker
    build:
      context: .
      dockerfile: infrastructure/php-worker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION-8.4}
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      redis:
        condition: service_healthy
      pgdog:
        condition: service_started
    environment:
      - DB_HOST=pgdog
      - DB_PORT=5432
      - DB_PASSWORD=/run/secrets/db_app_password
      - REDIS_PASSWORD=/run/secrets/redis_password
      - APP_KEY=/run/secrets/app_key
    volumes:
      - ./backend:/var/www
    secrets:
      - db_app_password
      - redis_password
      - app_key
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - app_network

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT-80}:80"
    volumes:
      - ./backend:/var/www
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app_network
    
  
  node-dev:
    container_name: node_dev
    profiles: ["dev"]
    build:
      context: .
      dockerfile: infrastructure/node/Dockerfile
      target: development
      args:
        FRONTEND_DIR: ./frontend
    working_dir: /app
    ports:
      - ${VITE_PORT-5173}:${VITE_PORT-5173}
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - app_network
    environment:
      - VITE_API_URL=http://localhost:80
    secrets:
      - vite_api_key
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 1G

  node-build:
    container_name: node_build
    profiles: ["build"]
    build:
      context: .
      dockerfile: infrastructure/node/Dockerfile
      target: builder
      args:
        FRONTEND_DIR: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - app_network
    environment:
      - VITE_API_URL=http://localhost:${APP_PORT:-5173}
    secrets:
      - vite_api_key
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 4G


networks:
  app_network:
    driver: bridge

secrets:
  app_key:
    file: ./secrets/app/app_key
  admin_password:
    file: ./secrets/app/admin_password
  db_username:
    file: ./secrets/database/db_username
  db_password:
    file: ./secrets/database/db_password
  db_app_password:
    file: ./secrets/database/db_app_password
  pgdog_admin_password:
    file: ./secrets/database/pgdog_admin_password
  db_root_password:
    file: ./secrets/database/db_root_password
  jwt_secret:
    file: ./secrets/jwt/jwt_secret
  redis_password:
    file: ./secrets/redis/redis_password
  vite_api_key:
    file: ./secrets/vite/vite_api_key
  smtp_password:
    file: ./secrets/smtp/smtp_password
  smtp_user:
    file: ./secrets/smtp/smtp_user


volumes:
  db_data:
    driver: local
  node_modules:
    driver: local
  storage: 
    driver: local