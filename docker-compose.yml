services:
  db:
    container_name: db
    image: postgres:18
    restart: unless-stopped
    ports: 
      - "${DB_PORT-5432}:${DB_PORT-5432}"
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/18/docker/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", {POSTGRES_USER}, "-h", "localhost", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      - app_network
    secrets:
      - db_password
      - db_root_password

  redis:
    container_name: redis
    image: redis:alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PORT=${REDIS_PORT-6379}
    command:
      - sh
      - -c
      - 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    restart: unless-stopped
    ports:
      - "${REDIS_PORT-6379}:${REDIS_PORT-6379}"
    networks:
      - app_network
    
  cache: 
    container_name: cache
    image: memcached:alpine
    restart: unless-stopped
    ports:
      - "${CACHE_PORT-11211}:${CACHE_PORT-11211}"
    networks:
      - app_network

  php:
    container_name: php
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_DIR: ./backend
        PHP_VERSION: ${PHP_VERSION-8.4}
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT-5432}
      - DB_NAME=${DB_NAME-app_db}
      - DB_USER=${DB_USER-app_user}
      - DB_PASSWORD=/run/secrets/db_password
      - REDIS_PORT=${REDIS_PORT-6379}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=/run/secrets/redis_password
      - CACHE_PORT=${CACHE_PORT-11211}
      - CACHE_HOST=cache
      - JWT_SECRET=/run/secrets/jwt_secret
      - XDEBUG_MODE=${XDEBUG_MODE-"develop"}
      - XDEBUG_CONFIG=${XDEBUG_CONFIG-"client_host=host.docker.internal"}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=/run/secrets/smtp_password
    working_dir: /var/www
    depends_on:
      - db
      - redis
      - cache
    extra_hosts:
      - host.docker.internal:host-gateway
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '1.5'
          memory: 2048M
    volumes:
      - ./backend:/var/www
    secrets:
      - db_password
      - jwt_secret
      - redis_password
    networks:
      - app_network

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT-80}:${NGINX_PORT-80}"
    volumes:
      - ./backend: /var/www
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app_network
    
  
  node-dev:
    container_name: node_dev
    profiles: ["dev"]
    build:
      context: .
      dockerfile: infrastructure/node/Dockerfile
      target: development
      args:
        FRONTEND_DIR: ./frontend
    working_dir: /app
    ports:
      - ${VITE_PORT-5173}:${VITE_PORT-5173}
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - app_network
    environment:
      - VITE_API_URL=http://localhost:${APP_PORT:-5173}
    secrets:
      - vite_api_key
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 1G

  node-build:
    container_name: node_build
    profiles: ["build"]
    build:
      context: .
      dockerfile: infrastructure/node/Dockerfile
      target: builder
      args:
        FRONTEND_DIR: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - app_network
    environment:
      - VITE_API_URL=http://localhost:${APP_PORT:-5173}
    secrets:
      - vite_api_key
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 4G

networks:
  app_network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret:
    file: ./secrets/jwt_secret
  redis_password:
    file: ./secrets/redis_password
  vite_api_key:
    file: ./secrets/vite_api_key
  smtp_password:
    file: ./secrets/smtp_password
  db_root_password:
    file: ./secrets/db_root_password
  app_key:
    file: ./secrets/app_key

volumes:
  db_data:
  node_modules:
    driver: local
