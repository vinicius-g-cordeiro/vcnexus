services:
  db:
    image: postgres
    restart: unless-stopped
    ports: 
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
        POSTGRES_PASSWORD_FILE: /run/secrets/db_password
        POSTGRES_USER: app_user
        POSTGRES_DB: app_db
        PGDATA: /var/lib/postgresql/18/docker/
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      test: [ 'CMD', 'pg_isready', '-U', 'app_user', '-h', 'localhost', '-p', '5432']
    secrets:
      - db_root_password
      - db_password
    networks:
      - app_network

  redis:
    container_name: redis
    image: redis:alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PORT=${REDIS_PORT-6379}
    command:
      - sh
      - -c
      - 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT-6379}:${REDIS_PORT-6379}"
    networks:
      - app_network
    
  cache: 
    container_name: cache
    image: memcached:alpine
    restart: unless-stopped
    ports:
      - "${CACHE_PORT-11211}:${CACHE_PORT-11211}"
    healthcheck:
      test: [ 'CMD', 'memcached', '-h', 'localhost' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  php:
    container_name: php
    env_file:
      - infrastructure/php/.env
    build:
      context: .
      dockerfile: infrastructure/php/Dockerfile
      args:
        BACKEND_DIR: ./backend
        PHP_VERSION: ${PHP_VERSION-8.4}
        ENV_FILE: ./infrastructure/php/.env
    environment:
      - DB_PASSWORD=/run/secrets/db_password
      - REDIS_PASSWORD=/run/secrets/redis_password
      - JWT_SECRET=/run/secrets/jwt_secret
      - SMTP_USERNAME=/run/secrets/smtp_user
      - SMTP_PASSWORD=/run/secrets/smtp_password
      - APP_KEY=/run/secrets/app_key
    working_dir: /var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      cache:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:38.0.101.76
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '1.0'
          memory: 1024M
    volumes:
      - ./backend:/var/www
      - ./infrastructure/php/.env:/var/www/.env
    secrets:
      - db_password
      - jwt_secret
      - redis_password
      - smtp_password
      - smtp_user
    networks:
      - app_network

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT-80}:80"
    volumes:
      - ./backend:/var/www
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app_network
    
  
  node-dev:
    container_name: node_dev
    profiles: ["dev"]
    build:
      context: .
      dockerfile: infrastructure/node/Dockerfile
      target: development
      args:
        FRONTEND_DIR: ./frontend
    working_dir: /app
    ports:
      - ${VITE_PORT-5173}:${VITE_PORT-5173}
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - app_network
    environment:
      - VITE_API_URL=http://localhost:80
    secrets:
      - vite_api_key
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 1G

  node-build:
    container_name: node_build
    profiles: ["build"]
    build:
      context: .
      dockerfile: infrastructure/node/Dockerfile
      target: builder
      args:
        FRONTEND_DIR: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - app_network
    environment:
      - VITE_API_URL=http://localhost:${APP_PORT:-5173}
    secrets:
      - vite_api_key
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 4G

networks:
  app_network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret:
    file: ./secrets/jwt_secret
  redis_password:
    file: ./secrets/redis_password
  vite_api_key:
    file: ./secrets/vite_api_key
  smtp_password:
    file: ./secrets/smtp_password
  db_root_password:
    file: ./secrets/db_root_password
  app_key:
    file: ./secrets/app_key
  smtp_user:
    file: ./secrets/smtp_user

volumes:
  db_data:
  node_modules:
    driver: local
