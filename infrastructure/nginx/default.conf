map $http_origin $cors_origin {
    default "";
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
    "http://localhost:80" $http_origin;
    "http://127.0.0.1:80" $http_origin;
    "http://localhost:8080" $http_origin;
    "http://127.0.0.1:8080" $http_origin;
    "http://localhost" $http_origin;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html; 

    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Do not take this away, this is for CORS and security, it's not going to be set on the backend code PHP, so this can be accessed through the frontend, postman, and APIs
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH, QUERY" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, X-Idempotency-Key, Content-Type, Accept, Authorization, X-CSRF-Token" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "3600" always;
    
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    client_max_body_size 2G;

    location /storage/ {
        alias /var/www/storage/upload/;
        autoindex off;
        try_files $uri =404;
    }

    location /dist {
        alias /var/www/public/dist;
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
    }

    location /ws {
        proxy_pass http://websocket:8080;
        proxy_http_version 2;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }



    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~ /\. {
        deny all;
    }

    location ~ /\.(?:htaccess|gitignore|env) {
        deny all;
    }
}